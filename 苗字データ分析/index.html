<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苗字音韻分布マップ - 日本地図可視化</title>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
        }

        .map-container {
            position: relative;
            width: 100%;
            height: 600px;
            background: #cbd5e1;
            /* Set background to map sea color or neutral */
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            overflow: hidden;
        }

        /* Leaflet override to match design */
        .leaflet-container {
            background: #f8fafc;
            font-family: inherit;
        }

        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .info h4 {
            margin: 0 0 5px;
            color: #777;
        }

        .gradient-bar {
            height: 10px;
            background: linear-gradient(to right, #eff6ff, #f97316);
            border-radius: 5px;
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">苗字音韻分布マップ</h1>
            <p class="text-slate-500 mt-2">日本の苗字上位1000件における、音（行・段）の地域偏りを可視化します。</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- コントロールパネル -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">分析対象</label>
                    <select id="modeSelect"
                        class="w-full p-3 border border-slate-200 rounded-lg bg-slate-50 focus:ring-2 focus:ring-orange-500 outline-none transition-all">
                        <option value="gyo">行で見る (あかさたな...)</option>
                        <option value="dan">段で見る (あいうえお...)</option>
                        <option value="char">50音で見る (あ, い, う...)</option>
                    </select>

                    <label class="block text-sm font-semibold text-slate-700 mt-6 mb-2">具体的な音を選択</label>
                    <div id="subCategoryContainer" class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto pr-2">
                        <!-- Buttons added by JS -->
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 mb-4">上位ランキング</h3>
                    <div id="rankingList" class="space-y-3">
                        <!-- Rankings added by JS -->
                    </div>
                </div>
            </div>

            <!-- 地図表示エリア -->
            <div class="lg:col-span-3">
                <div class="map-container">
                    <div id="map" class="w-full h-full"></div>

                    <!-- 凡例 (Leafletの上に重ねる) -->
                    <div
                        class="absolute bottom-6 right-6 z-[1000] bg-white/90 backdrop-blur p-4 rounded-xl border border-slate-100 shadow-sm leaflet-control">
                        <div class="text-xs font-bold text-slate-500 mb-2">分布密度（シェア %）</div>
                        <div class="gradient-bar w-32 mb-1"></div>
                        <div class="flex justify-between text-[10px] text-slate-400">
                            <span id="scaleMin">低</span>
                            <span id="scaleMax">高</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let geojsonLayer;
        let statsData = null;
        let geoJsonData = null;
        let selectedCategory = 'gyo';
        let selectedItem = 'あ行';

        // 色の計算
        function lerpColor(a, b, amount) {
            const ah = parseInt(a.replace(/#/g, ''), 16),
                ar = ah >> 16, ag = ah >> 8 & 0xff, ab = ah & 0xff,
                bh = parseInt(b.replace(/#/g, ''), 16),
                br = bh >> 16, bg = bh >> 8 & 0xff, bb = bh & 0xff,
                rr = ar + amount * (br - ar),
                rg = ag + amount * (bg - ag),
                rb = ab + amount * (bb - ab);
            return '#' + ((1 << 24) + (Math.round(rr) << 16) + (Math.round(rg) << 8) + Math.round(rb)).toString(16).slice(1);
        }

        async function init() {
            try {
                // Leaflet Map Init
                map = L.map('map', { zoomControl: false }).setView([37.8, 137], 5);

                // Add a minimal tile layer
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
                    attribution: '©OpenStreetMap, ©CartoDB',
                    subdomains: 'abcd',
                    maxZoom: 10
                }).addTo(map);

                // Fetch Data
                const [statsRes, geoRes] = await Promise.all([
                    fetch('./map_stats.json'),
                    fetch('https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson')
                ]);

                if (!statsRes.ok) throw new Error('Failed to load map_stats.json');
                if (!geoRes.ok) throw new Error('Failed to load GeoJSON');

                statsData = await statsRes.json();
                geoJsonData = await geoRes.json();

                updateSubcategories();
                updateVisualization();

            } catch (err) {
                console.error(err);
                alert('マップの読み込みに失敗しました: ' + err.message);
            }
        }

        function updateSubcategories() {
            const container = document.getElementById('subCategoryContainer');
            container.innerHTML = '';

            const items = Object.keys(statsData[selectedCategory]).sort();

            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `text-xs p-2 rounded-md transition-all ${item === selectedItem ? 'bg-orange-500 text-white shadow-md' : 'bg-white hover:bg-slate-100 text-slate-600 border border-slate-200'}`;
                btn.innerText = item;
                btn.onclick = () => {
                    selectedItem = item;
                    updateSubcategories(); // Update active state
                    updateVisualization();
                };
                container.appendChild(btn);
            });
        }

        function updateVisualization() {
            if (!statsData || !geoJsonData) return;

            // Calculate Min/Max for current selection
            const valObj = statsData[selectedCategory][selectedItem];
            const rawValues = Object.values(valObj);
            const values = rawValues.map(v => Number(v) || 0);

            const min = values.length ? Math.min(...values) : 0;
            const max = values.length ? Math.max(...values) : 0;

            document.getElementById('scaleMin').innerText = min.toFixed(1) + '%';
            document.getElementById('scaleMax').innerText = max.toFixed(1) + '%';

            // Define Style Function
            function style(feature) {
                const prefName = feature.properties.nam_ja; // Adjust based on GeoJSON property key
                const val = Number(valObj[prefName]) || 0;

                // Color ramp
                let fillColor = '#eff6ff';
                if (max > min) {
                    const ratio = (val - min) / (max - min);
                    fillColor = lerpColor('#f3f4f6', '#f97316', ratio);
                } else if (val > 0) {
                    fillColor = '#f97316'; // If all same and > 0
                }

                return {
                    fillColor: fillColor,
                    weight: 1,
                    opacity: 1,
                    color: 'white',
                    dashArray: '3',
                    fillOpacity: 0.8
                };
            }

            // Remove existing layer if any
            if (geojsonLayer) {
                map.removeLayer(geojsonLayer);
            }

            // Add GeoJSON Layer
            geojsonLayer = L.geoJson(geoJsonData, {
                style: style,
                onEachFeature: function (feature, layer) {
                    const prefName = feature.properties.nam_ja;
                    const val = Number(valObj[prefName]) || 0;

                    layer.bindTooltip(`<strong>${prefName}</strong><br>${selectedItem}: ${val.toFixed(2)}%`, {
                        sticky: true,
                        direction: 'top',
                        className: 'bg-slate-800 text-white p-2 rounded text-xs border-none shadow-xl'
                    });

                    layer.on({
                        mouseover: (e) => {
                            const l = e.target;
                            l.setStyle({
                                weight: 3,
                                color: '#666',
                                dashArray: '',
                                fillOpacity: 1
                            });
                            l.bringToFront();
                        },
                        mouseout: (e) => {
                            geojsonLayer.resetStyle(e.target);
                        }
                    });
                }
            }).addTo(map);

            // Update Ranking
            const ranking = Object.entries(valObj)
                .map(([k, v]) => [k, Number(v) || 0])
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const rankingDiv = document.getElementById('rankingList');
            rankingDiv.innerHTML = ranking.map(([pref, val], idx) => `
                <div class="flex items-center justify-between group">
                    <span class="text-sm text-slate-600"><span class="font-bold text-slate-400 mr-2">${idx + 1}</span>${pref}</span>
                    <span class="text-sm font-bold text-orange-600">${val.toFixed(1)}%</span>
                </div>
            `).join('');
        }

        document.getElementById('modeSelect').addEventListener('change', (e) => {
            selectedCategory = e.target.value;
            // Select first item of new category
            const newItems = Object.keys(statsData[selectedCategory]).sort();
            if (newItems.length > 0) {
                selectedItem = newItems[0];
            }
            updateSubcategories();
            updateVisualization();
        });

        init();
    </script>
</body>

</html>
